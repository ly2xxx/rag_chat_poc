name: SDLC Phase Check

# Checks one built phase (a pull request from phase/<feature>/<n> into
# feature/<feature>) against the approved plan before it is merged. The check is the
# reusable workflow in ly2xxx/.github.

on:
  pull_request:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  phase:
    uses: ly2xxx/.github/.github/workflows/sdlc-phase.yml@main
    with:
      # The same test suite as sdlc.yml.
      test-command: python -m pytest -q
      # The pins (torch 2.1.0) have no Python 3.12 wheels; 3.11 matches .devcontainer.
      python-version: "3.11"
      # CPU-only torch: the default index pulls gigabytes of CUDA libraries.
      install-command: uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
